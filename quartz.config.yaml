# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Kasumi Tang
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: blog.ksmtang.com
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local
    cdnCaching: true
    typography:
      title: Kiwi Maru
      header: Noto Serif TC
      body: Cactus Classical Serif
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "rgb(121, 114, 85)"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "rgb(121, 114, 85)"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
    options:
      useThemeFonts: false
      fontOrigin: local
      title: Kiwi Maru
      interface: Kiwi Maru
      header: Noto Serif TC
      h1: Noto Serif TC
      body: Cactus Classical Serif
      code: IBM Plex Mono
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: false
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: false
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: false
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/graph
    enabled: true
    layout:
      position: right
      priority: 40
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: right
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 60
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: false
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: right
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: right
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options:
        repo: MATHhahetaDEATH/blog
        repoId: R_kgDOTEoNZw
        category: General
        categoryId: DIC_kwDOTEoNZ84C_6-T
        mapping: pathname
        strict: false
        reactionsEnabled: true
        emitMetadata: false
        inputPosition: bottom
        theme: preferred_color_scheme
        lang: zh-CN
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: false
    options:
      links:
        GitHub: https://github.com/jackyzha0/quartz
        Discord Community: https://discord.gg/cRFFHYye7t
  - source: github:quartz-community/recent-notes
    enabled: false
    options:
      title: Recent Notes
      limit: 5
      linkToMore: false
      showTags: true
    layout:
      position: left
      priority: 25
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: ./quartz-custom/site-logo
    enabled: true
    options:
      href: /
      src: https://img.ksmtang.com/logo.svg
      alt: Kasumi Tang
      width: 240
      height: 80
    layout:
      position: left
      priority: 10
  - source: ./quartz-custom/sidebar-section
    enabled: true
    options:
      title: Moments
      href: /journal_flow/
      folder: journal_flow
      showPreview: true
      previewLabel: 最新的
      previewChars: 50
    layout:
      position: left
      priority: 20
  - source: ./quartz-custom/sidebar-section
    enabled: true
    options:
      title: 過期思想
      href: /deprecated/
      folder: deprecated
      showPreview: false
    layout:
      position: left
      priority: 25
  - source: ./quartz-custom/sidebar-section
    enabled: true
    options:
      title: 笔记分享
      href: /stem/
      folder: stem
      showPreview: false
    layout:
      position: left
      priority: 30
  - source: ./quartz-custom/diary-calendar
    enabled: true
    options:
      folder: dairy
      title: ダイアリー
      recentLabel: 最近のダイアリー
      previewChars: 50
      weekStartsOn: 1
    layout:
      position: left
      priority: 35
  - source: ./quartz-custom/sidebar-discussions
    enabled: true
    options:
      repo: MATHhahetaDEATH/blog
      limit: 3
      maxChars: 50
      title: 最近讨论
    layout:
      position: left
      priority: 40
  - source: ./quartz-custom/site-map-link
    enabled: true
    options:
      label: Site Map
      href: /index/
    layout:
      position: right
      priority: 25
  - source: ./quartz-custom/sidebar-divider
    enabled: true
    layout:
      position: right
      priority: 30
  - source: ./quartz-custom/footer
    enabled: true
    options:
      quickLinks:
        - label: Moments
          href: /journal_flow/
          description: 威力加强版的朋友圈
        - label: ダイアリー
          href: /dairy/
          description: 快来这里「视奸」我
        - label: 過期思想
          href: /deprecated/
          description: 「Paradigm Shift」的灰燼
        - label: 笔记分享
          href: /stem/
          description: 所有（未完成）笔记的归档
      aboutLinks:
        - label: About
          href: https://www.ksmtang.com/about
        - label: Site Map
          href: /index/
      links:
        - label: かすみのサイト
          href: https://www.ksmtang.com/
          description: 主站
        - label: XYX's Website
          href: https://xyx.1919810.com/
          description: "A small website. 一个很普通的小站. "
      socialLinks:
        - label: GitHub
          href: https://github.com/MATHhahetaDEATH
        - label: Bilibili
          href: https://space.bilibili.com/322168286
        - label: Weixin
          popup: KASUMI和他愉快的伙伴们
        - label: Zhihu
          popup: 晨沐公
  - source: ./quartz-custom/giscus-comments
    enabled: true
    options:
      repo: MATHhahetaDEATH/blog
      repoId: R_kgDOTEoNZw
      category: General
      categoryId: DIC_kwDOTEoNZ84C_6-T
      mapping: pathname
      strict: false
      reactionsEnabled: true
      emitMetadata: false
      inputPosition: bottom
      theme: preferred_color_scheme
      lang: zh-CN
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
layout:
  groups:
    toolbar:
      priority: 10
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
    tag:
      exclude:
        - reader-mode
    canvas: {}
    bases: {}
